<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · vibe-templates</title>
  <style>
    * { box-sizing: border-box }
    html { color-scheme: light; background: #f4f8f8; color: #102021; font: 16px/1.5 system-ui,sans-serif }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
      background: radial-gradient(ellipse at 18% 0%,#d9f5e9,transparent 46%),radial-gradient(ellipse at 85% 10%,#e2e9f6,transparent 50%),#f4f8f8 }
    header { padding: max(16px,env(safe-area-inset-top)) clamp(16px,4vw,56px) 16px; display: flex; align-items: center; gap: 10px; font-weight: 680 }
    header span { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: #38d39c }
    main { margin: auto; width: min(100%,440px); padding: 20px clamp(14px,4vw,24px) max(20px,env(safe-area-inset-bottom)) }
    form { background: white; border: 1px solid #d4e1de; border-radius: 16px; padding: clamp(18px,5vw,32px); box-shadow: 0 12px 40px #153d3010 }
    h1 { margin: 0 0 18px; font-size: clamp(24px,5vw,32px); line-height: 1.15; letter-spacing: -.04em }
    label { display: block; margin-bottom: 6px; font-weight: 550 }
    input,button { display: block; width: 100%; min-width: 0; min-height: 44px; border-radius: 8px; padding: 10px 12px; font: inherit }
    input { border: 1px solid #93aba5; background: white; color: inherit }
    button { margin-top: 16px; background: #123c30; border: 0; color: white; font-weight: 650; cursor: pointer }
    :focus-visible { outline: 3px solid #00865f; outline-offset: 2px }
    [role=alert] { color: #802c22; margin: 0 0 12px }
    @media (max-height: 420px) { header { padding-block: 8px } main { padding-block: 6px } form { padding-block: 14px } }
  </style>
</head>
<body>
  <header><span aria-hidden="true">v.</span>vibe-templates</header>
  <main><form method="post" action="/_signin">
    <h1>Open your gallery</h1>
    <!--error-->
    <input type="hidden" name="username" value="book">
    <label for="password">Gallery password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button>Open gallery</button>
  </form></main>
</body>
</html>
