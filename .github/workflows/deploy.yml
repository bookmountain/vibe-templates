name: Deploy vibe-templates
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: production-gallery
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && python -m unittest discover -s tests
      - name: Queue this revision on the gallery server
        run: git push origin HEAD:refs/heads/deploy
      - name: Verify the revision served through Cloudflare
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 100); do
            actual=$(curl -fsS --max-time 6 https://vibe-template.bookmountain.work/_deployment || true)
            if [ "$actual" = "$EXPECTED_SHA" ]; then exit 0; fi
            sleep 5
          done
          exit 1
